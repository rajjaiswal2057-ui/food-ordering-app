name: Order Total CI

on:
  push:
    branches: [ main ]

jobs:
  calculate-order-total:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run order total calculation
        run: python calculate_total.py

      - name: Run pytest
        run: |
          pip install pytest
          pytest -v
